name: Build Lena APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Auto-generate Gradle wrapper inside CI if somehow missing in git
    - name: Ensure Gradle Wrapper
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version 8.5
        fi
        chmod +x gradlew

    # Gradle caching to make builds extremely fast
    - name: Setup Gradle Cache
      uses: gradle/actions/setup-gradle@v3

    # Build Debug APK using wrapper (takes Gradle 8.5)
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --warning-mode all

    # Upload APK as GitHub artifact
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Lena-v2.0-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk